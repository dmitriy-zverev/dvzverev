server {
  listen 443 ssl http2;
  server_name www.dvzverev.ru;

  root /var/www/dvzverev/current;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.yandex.ru https://*.yandex.com; font-src 'self'; connect-src 'self' https://*.yandex.ru https://*.yandex.com; frame-src https://mc.yandex.ru https://mc.yandex.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://t.me" always;

  location / {
    gzip_static on;
    brotli_static on;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|woff2|avif|webp|xml|txt|json|br|gz)$ {
    gzip_static on;
    brotli_static on;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    gzip_static on;
    brotli_static on;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }
}

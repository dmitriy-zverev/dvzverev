# Dedicated to the autoposter; the existing Mayak proxy is not modified.
http_port 31.57.107.85:3129
visible_hostname dvzverev-autoposter-proxy
pid_filename /run/squid-autoposter.pid
acl bot_server src 82.202.136.235/32
acl CONNECT method CONNECT
acl tls_port port 443
acl bot_apis dstdomain openrouter.ai api.telegram.org
http_access deny !CONNECT
http_access deny !tls_port
http_access allow bot_server bot_apis
http_access deny all
cache deny all
cache_mem 8 MB
access_log stdio:/var/log/squid-autoposter/access.log
cache_log /var/log/squid-autoposter/cache.log
logfile_rotate 3
connect_timeout 15 seconds

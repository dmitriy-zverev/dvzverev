# Dedicated forward proxy. Reach remotely through an SSH tunnel.
http_port 127.0.0.1:3129
visible_hostname dvzverev-openrouter-proxy
pid_filename /run/squid-openrouter.pid

acl local_client src 127.0.0.1/32
acl CONNECT method CONNECT
acl tls_port port 443
acl openrouter_api dstdomain openrouter.ai

# All allow conditions must match; deny everything else.
http_access deny !CONNECT
http_access deny !tls_port
http_access allow local_client openrouter_api
http_access deny all

# HTTPS stays encrypted between the client and OpenRouter (no SSL bump).
cache deny all
cache_mem 16 MB
access_log stdio:/var/log/squid/openrouter-access.log
cache_log /var/log/squid/openrouter-cache.log
logfile_rotate 5
connect_timeout 15 seconds

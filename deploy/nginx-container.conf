server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  gzip_static on;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.yandex.ru https://*.yandex.com; font-src 'self'; connect-src 'self' https://*.yandex.ru https://*.yandex.com; frame-src https://mc.yandex.ru https://mc.yandex.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://t.me" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location = /bot/ {
    expires -1;
    try_files /bot/index.html =404;
  }
  # OAuth callback codes must never enter access logs. Resolve the cabinet only
  # when a request arrives so the isolated deployment health check still works.
  location /vk/ {
    access_log off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $oauth_upstream http://dvzverev-cabinet:8787;
    proxy_pass $oauth_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 240s;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
  }
  location / { try_files $uri $uri/ =404; }
  location ~ ^/(?:_astro|fonts)/ { expires 1y; }
  location ~ \.html$ { expires -1; }
  error_page 404 /404.html;
}

name: dvzverev-poster
services:
  redis:
    image: redis:7-alpine
    container_name: dvzverev-redis
    env_file: .env
    command:
      - sh
      - -ec
      - |
        test -n "$$BOT_REDIS_PASSWORD" || { echo "BOT_REDIS_PASSWORD is required" >&2; exit 1; }
        exec redis-server \
          --requirepass "$$BOT_REDIS_PASSWORD" \
          --save "" \
          --appendonly no \
          --maxmemory 48mb \
          --maxmemory-policy allkeys-lru
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
  poster:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to a verified release tag}
    container_name: dvzverev-poster
    depends_on:
      - redis
    labels:
      app: dvzverev-poster
    env_file: .env
    environment:
      BOT_CONFIG_PATH: /app/service.json
      BOT_QUEUE_PATH: /app/content/posts.json
      BOT_STATE_PATH: /app/data/state.json
      BOT_LOG_DIR: /app/data/logs
      BOT_CABINET_DB_PATH: /app/data/cabinet.sqlite
      NODE_USE_ENV_PROXY: '1'
    volumes:
      - ./content:/app/content:ro
      - ./data:/app/data
      - ./service.json:/app/service.json:ro
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    stop_grace_period: 240s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
  cabinet:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to a verified release tag}
    container_name: dvzverev-cabinet
    depends_on:
      - redis
    labels:
      app: dvzverev-cabinet
    command: ['node', 'bot/cabinet/server.mjs']
    env_file: .env
    environment:
      BOT_CABINET_HOST: 0.0.0.0
      BOT_CABINET_PORT: '8787'
      BOT_CABINET_DB_PATH: /app/data/cabinet.sqlite
      BOT_CONFIG_PATH: /app/service.json
      BOT_CABINET_SECURE_COOKIES: 'true'
      BOT_CABINET_ALLOWED_ORIGINS: https://www.dvzverev.ru,https://dvzverev.ru
    volumes:
      - ./data:/app/data
      - ./service.json:/app/service.json:ro
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    networks:
      - default
      - dvzverev_edge
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

networks:
  dvzverev_edge:
    external: true

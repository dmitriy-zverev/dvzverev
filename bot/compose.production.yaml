name: dvzverev-poster
services:
  poster:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to a verified release tag}
    container_name: dvzverev-poster
    labels:
      app: dvzverev-poster
    env_file: .env
    environment:
      BOT_CONFIG_PATH: /app/service.json
      BOT_QUEUE_PATH: /app/content/posts.json
      BOT_STATE_PATH: /app/data/state.json
      BOT_LOG_DIR: /app/data/logs
      NODE_USE_ENV_PROXY: '1'
    volumes:
      - ./content:/app/content:ro
      - ./data:/app/data
      - ./service.json:/app/service.json:ro
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    stop_grace_period: 240s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/media-python"
          "$RUNNER_TEMP/media-python/bin/pip" install Pillow
          echo "$RUNNER_TEMP/media-python/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm precompress
      - run: pnpm size-budget
      - run: pnpm check-bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm lighthouse
      - run: pnpm audit --audit-level moderate

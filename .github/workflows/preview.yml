name: preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm check-bundle
      - run: pnpm lighthouse

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # Connect repository to Cloudflare Pages and add secrets:
  # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
  deploy:
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dvzverev --branch=${{ github.head_ref || github.ref_name }}
